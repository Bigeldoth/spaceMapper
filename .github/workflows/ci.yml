name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Une nouvelle poussée annule la vérification en cours sur la même branche :
# inutile de payer deux compilations Rust pour un état intermédiaire.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Windows)
    # windows-latest embarque MSVC, ce que la machine de dev n'a pas :
    # c'est ici que le code DirectInput est réellement vérifié.
    runs-on: windows-latest
    steps:
      # `main` est la production : même une PR verte ne peut pas y arriver
      # directement depuis une branche de chantier. Ce job est déjà un statut
      # obligatoire de la protection de `main`, donc son échec bloque le merge.
      - name: Vérifier le flux de branches
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'staging'
        run: |
          Write-Error "Une PR vers main doit provenir de staging, pas de $env:GITHUB_HEAD_REF."
          exit 1

      - uses: actions/checkout@v5

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Vérifier le formatage
        run: cargo fmt --all -- --check

      - name: Clippy
        # `-D warnings` : un avertissement laissé passer devient la norme.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Un seul lockfile pour tout le workspace npm (packages/ui + Lite) :
      # npm ci s'exécute à la racine, pas dans apps/spacemapper-lite.
      - run: npm ci

      # packages/ui expose du JS pré-compilé ; npm ci l'installe/lie mais ne
      # le construit pas — sans cette étape, Lite ne trouverait pas dist/.
      - name: Build des paquets partagés
        run: |
          npm run build -w packages/ui
          npm run build -w packages/app-core

      # packages/ui/dist est commité, parce que le dépôt privé Premium le
      # consomme par submodule git sans reconstruire ce workspace. Un dist
      # commité peut donc diverger de src/ sans que rien ne le signale : Lite
      # compilerait depuis les sources et paraîtrait correct pendant que
      # Premium sert l'ancien build. On refuse le commit dans ce cas.
      - name: Vérifier que dist/ correspond aux sources
        run: |
          if ! git diff --quiet -- packages/ui/dist packages/app-core/dist; then
            echo "::error::Un dist/ commité ne correspond pas aux sources."
            echo "Relancez le build des paquets partagés et committez le résultat."
            git diff --stat -- packages/ui/dist packages/app-core/dist
            exit 1
          fi

      - name: Typecheck
        working-directory: apps/spacemapper-lite
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/spacemapper-lite
        run: npx vite build
