name: Release Lite

# DirectInput est Windows-only, tauri.conf.json ne cible que nsis : un seul
# runner suffit, pas de matrice multi-OS comme un template Tauri générique.
#
# Deux familles de tags, un seul workflow :
#   lite-v0.2.0-rc1  (pose sur staging) -> pre-release PUBLIÉE, pour la boucle
#                                          de test avant mise en production.
#   lite-v0.2.0      (pose sur main)    -> release stable, laissée en BROUILLON :
#                                          la publication vers les clients reste
#                                          un geste manuel.
on:
  push:
    tags:
      - "lite-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish l'installateur Windows
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 — la vérification de provenance ci-dessous a besoin de
      # l'historique complet pour situer le tag par rapport aux branches.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Un tag stable posé par erreur sur staging publierait du code non validé
      # sous un numéro de version définitif. On refuse avant de compiler et on
      # vérifie toutes les sources de version visibles dans l'application.
      - name: Vérifier la provenance du tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-rc* ]]; then
            attendu=staging
          else
            attendu=main
          fi
          # checkout ne garantit pas les refs de branches quand on construit un
          # tag : on les demande explicitement avant de comparer.
          git fetch --quiet origin main staging
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${attendu}"; then
            echo "Tag ${GITHUB_REF_NAME} bien issu de ${attendu}."
          else
            echo "::error::${GITHUB_REF_NAME} doit être posé sur ${attendu}, or ce commit n'y est pas."
            exit 1
          fi
          # Un tag lite-v0.2.0 qui produit un installateur estampillé 0.1.0 est
          # indétectable une fois le fichier chez un testeur : on compare.
          version_tag="${GITHUB_REF_NAME#lite-v}"
          version_tag="${version_tag%%-rc*}"
          version_conf=$(node -p "require('./apps/spacemapper-lite/src-tauri/tauri.conf.json').version")
          version_package=$(node -p "require('./apps/spacemapper-lite/package.json').version")
          version_cargo=$(node -e '
            const text = require("node:fs").readFileSync("Cargo.toml", "utf8");
            const section = text.split("[workspace.package]")[1]?.split(/\r?\n\[/)[0] ?? "";
            const match = section.match(/^version\s*=\s*"([^"]+)"/m);
            if (!match) throw new Error("version absente de [workspace.package]");
            console.log(match[1]);
          ')
          for valeur in \
            "tauri.conf.json:$version_conf" \
            "package.json:$version_package" \
            "Cargo.toml:$version_cargo"
          do
            source_version="${valeur%%:*}"
            numero="${valeur#*:}"
            if [[ "$version_tag" != "$numero" ]]; then
              echo "::error::Le tag annonce $version_tag mais $source_version est en $numero."
              exit 1
            fi
          done

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/spacemapper-lite/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Un seul lockfile pour tout le workspace npm (packages/ui + Lite).
      - name: Installer les dépendances frontend
        run: npm ci

      # tauri-action relance `beforeBuildCommand` (npm run build) dans
      # apps/spacemapper-lite, qui a besoin de @spacemapper/ui/dist déjà
      # construit — npm ci installe/lie le workspace mais ne le construit pas.
      - name: Build @spacemapper/ui
        run: npm run build -w packages/ui

      # Le corps de la release contient des sauts de ligne : le composer dans
      # une expression ${{ }} n'est pas possible, on le prépare ici.
      - name: Préparer le texte de la release
        id: texte
        shell: bash
        run: |
          commun="Édition Lite, gratuite et hors-ligne. Installateur Windows (NSIS), français et anglais."
          depot="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "corps<<FIN_DU_CORPS"
            if [[ "${GITHUB_REF_NAME}" == *-rc* || "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "**Version candidate — destinée aux testeurs, pas à un usage en production.**"
              echo
              echo "Merci de remonter tout problème dans les [issues](${depot}/issues) avant la publication de la version stable."
              echo
              echo "[Journal des modifications](${depot}/commits/staging)"
            else
              echo "Voir le [journal des modifications](${depot}/commits/main) pour le détail des changements."
            fi
            echo
            echo "$commun"
            echo "FIN_DU_CORPS"
          } >> "$GITHUB_OUTPUT"

      - name: Build + publication de l'installateur
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Une RC et un lancement manuel sont des builds hors production :
          # le backend isole alors réglages et sauvegardes dans
          # %APPDATA%\SpaceMapper-Staging.
          SPACEMAPPER_CHANNEL: >-
            ${{ (github.ref_type != 'tag' || contains(github.ref_name, '-rc'))
                && 'staging'
                || 'production' }}
        with:
          projectPath: apps/spacemapper-lite
          # La configuration additionnelle donne aussi un nom et un identifiant
          # d'installation distincts à tous les builds hors production.
          args: >-
            ${{ (github.ref_type != 'tag' || contains(github.ref_name, '-rc'))
                && '--config src-tauri/tauri.staging.conf.json'
                || '' }}
          # Sans tagName, tauri-action construit mais ne crée aucune Release.
          # C'est le comportement voulu pour workflow_dispatch.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: >-
            ${{ github.ref_type == 'tag'
                && format('SpaceMapper Lite {0}', github.ref_name)
                || '' }}
          releaseBody: ${{ steps.texte.outputs.corps }}
          # Une RC est publiée directement (les testeurs doivent pouvoir la
          # télécharger) mais marquée pre-release : elle n'apparaît jamais comme
          # « Latest ». Une version stable, elle, reste un brouillon que tu
          # publies à la main quand tu es prêt à la rendre visible aux clients.
          releaseDraft: ${{ github.ref_type != 'tag' || !contains(github.ref_name, '-rc') }}
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-rc') }}

      # Un lancement manuel ne crée ni tag ni Release publique. L'installateur
      # reste néanmoins un artifact d'un dépôt public : il est moins visible,
      # pas confidentiel. Une rétention courte limite sa durée d'exposition.
      - name: Conserver le build manuel comme artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: spacemapper-lite-staging-${{ github.run_number }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
