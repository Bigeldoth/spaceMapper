[workspace]
resolver = "2"
members = [
    "crates/spacemapper-core",
    "crates/spacemapper-edit",
    "crates/spacemapper-app-support",
    "apps/spacemapper-lite/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
authors = ["Patrice Declemy <declemy.patrice@gmail.com>"]
homepage = "https://padek-interactive.tech"
repository = "https://github.com/Bigeldoth/spaceMapper"

[workspace.dependencies]
spacemapper-core = { path = "crates/spacemapper-core" }
spacemapper-edit = { path = "crates/spacemapper-edit" }
spacemapper-app-support = { path = "crates/spacemapper-app-support" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# roxmltree pour lire : il conserve les positions, indispensable aux
# diagnostics. quick-xml pour écrire : son modèle par événements permet de
# recopier à l'identique tout ce qu'on ne modifie pas.
roxmltree = "0.20"
quick-xml = "0.37"
# Data.p4k emploie la méthode de compression 100, qui est du Zstandard
# standard — vérifié sur l'archive : les trames portent bien la signature
# 28 b5 2f fd, sans enveloppe propriétaire.
zstd = "0.13"
tracing = "0.1"

[profile.release]
# Cible <80 Mo de RAM et <2 s de démarrage : on optimise la taille et on
# laisse LLVM inliner à travers les crates.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
