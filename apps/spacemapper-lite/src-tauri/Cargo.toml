[package]
name = "spacemapper-lite"
description = "SpaceMapper Lite — lecture et aperçu des contrôles Star Citizen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
# Tauri v2 attend une lib nommée `<name>_lib` en plus du binaire.
name = "spacemapper_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# `link.exe` s'exprime dans la langue du système et annonce la création du
# .lib/.exp ; la lint relaie ces messages d'information comme des
# avertissements. Bruit pur sur un MSVC non anglophone, et bloquant en CI où
# les avertissements sont refusés.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

spacemapper-core = { workspace = true }
spacemapper-edit = { workspace = true }
spacemapper-app-support = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
